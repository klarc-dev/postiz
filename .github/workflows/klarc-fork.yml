# Klarc fork maintenance. Lives in its own file so upstream workflow changes
# never conflict with it. Keeps klarc/main = latest upstream release + the Klarc patch
# commits, tests the patch, and publishes the image Coolify deploys.
name: Klarc fork

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sync:
        description: Rebase the Klarc patch on the latest upstream release first
        type: boolean
        default: true
  push:
    branches: [klarc/main]

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  group: klarc-fork
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sync-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: klarc/main
          fetch-depth: 0

      - name: Rebase the Klarc patch on the latest upstream release
        id: sync
        if: github.event_name != 'push' && (github.event_name == 'schedule' || inputs.sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "klarc-fork-bot"
          git config user.email "dev@klarc.com"
          git remote add upstream https://github.com/gitroomhq/postiz-app.git
          git fetch upstream main --tags
          # Track published releases (what upstream ships as :latest), not main.
          release=$(gh api repos/gitroomhq/postiz-app/releases/latest --jq .tag_name)
          base=$(git merge-base HEAD upstream/main)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse "$release^{commit}")" = "$base" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on top of $release."
            exit 0
          fi
          if ! git rebase --onto "$release" "$base"; then
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report a rebase conflict
        if: failure() && steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync conflict: Klarc patch no longer applies"
          body="The daily rebase of klarc/main on gitroomhq/postiz-app main failed (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Production keeps the last good image. Resolve locally: git fetch upstream && git rebase upstream/main, fix the YouTube patch, run the tests, push --force-with-lease."
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"; else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Test the Klarc patch
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npx jest -c jest.klarc.config.js

      - name: Publish the rebased branch
        if: steps.sync.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:klarc/main

      - name: Decide whether to build
        id: build
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tag
        if: steps.build.outputs.needed == 'true'
        id: tag
        run: |
          git fetch -q https://github.com/gitroomhq/postiz-app.git main --tags
          release=$(git describe --tags --abbrev=0 "$(git merge-base HEAD FETCH_HEAD)")
          echo "version=klarc-${release}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.build.outputs.needed == 'true'

      - uses: docker/login-action@v3
        if: steps.build.outputs.needed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.build.outputs.needed == 'true'
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ steps.tag.outputs.version }} \
            --pull --provenance=false --sbom=false \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.version }} \
            -t ${{ env.IMAGE }}:klarc-latest \
            --push .
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
